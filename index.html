<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Kubilay Özmen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 4vh 4vw;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Helvetica, Arial, sans-serif;
      background: #f4f4f4;
      color: #111111;
      line-height: 1.6;
    }

    /* Dil satırı */
    .lang {
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .lang a {
      color: #111111;
      text-decoration: none;
    }

    .lang .active {
      font-weight: 500;
      pointer-events: none;
      cursor: default;
    }

    .sep {
      margin: 0 0.4rem;
    }

    /* Kimlik */
    .identity {
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      margin: 0;
    }

    p {
      font-size: 0.95rem;
      margin: 0.25rem 0 0 0;
    }

    /* Menü */
    nav {
      margin-top: 1.5rem;
      margin-bottom: 3rem;
    }

    nav a {
      font-size: 0.95rem;
      color: #111111;
      text-decoration: none;
      display: inline-block;
      margin-right: 1rem;
    }
